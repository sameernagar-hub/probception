[project]
name = "probception"
version = "0.1.0"
description = "An AI scientist that holds explicit beliefs and runs the experiment most likely to prove itself wrong."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Team Probception" },
]
keywords = ["ai-agent", "bayesian", "experimental-design", "computational-biology", "reagent"]

dependencies = [
    "anthropic>=0.69",
    "pydantic>=2.9",
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]
# Heavy scientific extras. Installed on demand — the core loop runs without them.
bio = [
    "biopython>=1.84",
]
compute = [
    "modal>=0.68",
]

[project.scripts]
probception = "probception.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/probception"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
